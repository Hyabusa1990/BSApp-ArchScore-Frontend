# SPA-Fallback für adapter-static (fallback: 'index.html' in svelte.config.js) — jede
# nicht gefundene Datei bekommt index.html, SvelteKits Client-Router übernimmt danach das
# Routing. /api/* taucht hier absichtlich nicht auf: der vorgeschaltete Reverse Proxy
# (Caddy) routet das direkt zum Backend-Container, dieser Server sieht diese Requests nie.

server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# Gehashte, unveränderliche Build-Assets — dürfen aggressiv gecacht werden.
	location /_app/immutable/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	# index.html + alles andere (Icons, robots.txt, ...) — nie langfristig cachen, sonst
	# bekommen Nutzer nach einem Deploy eine alte App-Shell, die nicht mehr zu den neuen,
	# gehashten Assets passt.
	location / {
		add_header Cache-Control "no-cache";
		try_files $uri $uri/ /index.html;
	}

	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
