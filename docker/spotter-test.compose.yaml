# Test-Stack spotter-test.bsapp.de (Komodo-Stack): Postgres + Fawkes-Backend + Frontend.
# Alle persistenten Daten liegen unter /srv/spotter-test/ (Bind-Mounts, siehe unten).
# Reverse Proxy ist der NGINX Proxy Manager (NPM) auf einem ANDEREN Host: er terminiert TLS und
# routet auf die hier veröffentlichten Host-Ports (Defaults, per Komodo-Environment änderbar):
#   spotter-test.bsapp.de/      -> <Docker-Host-IP>:${WEB_PORT:-18080}   (Frontend, static-web-server)
#   spotter-test.bsapp.de/api/  -> <Docker-Host-IP>:${API_PORT:-18081}   (Backend, "/api" wird im NPM abgeschnitten)
# Die Ports sind im LAN erreichbar: per Host-Firewall auf die NPM-IP beschränken, nicht ins
# Internet freigeben. Postgres veröffentlicht keinen Port (nur internes Netz).
#
# Einmalig auf dem Host vorbereiten:
#   mkdir -p /srv/spotter-test/postgres
#   (Postgres chownt das Datenverzeichnis beim ersten Start selbst.)
# Secrets in Komodo unter "Environment" setzen (nicht ins Repo): POSTGRES_PASSWORD, JWT_KEY, JWT_DEVICE_KEY.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fawkes
      POSTGRES_USER: fawkes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in Komodo setzen}
    volumes:
      - /srv/spotter-test/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fawkes -d fawkes']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # Tag für reproduzierbare Tests auf einen sha-<commit>-Tag pinnen:
    # https://github.com/Hyabusa1990/BSApp-ArchScore-Backend/pkgs/container/bsapp-archscore-backend
    image: ghcr.io/hyabusa1990/bsapp-archscore-backend:${API_TAG:-latest}
    restart: unless-stopped
    pull_policy: always
    environment:
      ASPNETCORE_URLS: http://+:80
      # Production: kein Swagger, keine Developer-Exception-Page (die gibt sonst Header inkl.
      # Bearer-Tokens in 500-Antworten aus). Für Swagger auf Development stellen — nur intern!
      ASPNETCORE_ENVIRONMENT: Production
      # appsettings.json liefert einen öffentlichen Default-Key ("ChangeThisInProduction") — wer ihn
      # kennt, kann gültige Tokens (auch Admin) fälschen. Beide Keys (User- und Device-/Tablet-
      # Token) in Komodo setzen, mind. 32 Zeichen, unterschiedlich: `openssl rand -base64 48`.
      Jwt__Key: ${JWT_KEY:?JWT_KEY in Komodo setzen}
      JwtDevice__Key: ${JWT_DEVICE_KEY:?JWT_DEVICE_KEY in Komodo setzen}
      ConnectionStrings__FawkesConnection: Host=postgres;Username=fawkes;Password=${POSTGRES_PASSWORD};Database=fawkes;TrustServerCertificate=True;
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${API_PORT:-18081}:80'

  web:
    # Image wird bei jedem Push auf main gebaut (.github/workflows/build-and-push.yml); Tags:
    # latest und sha-<commit> (zum Pinnen). PUBLIC_ALLOW_REGISTRATION ist im Image eingebrannt
    # (GitHub-Repo-Variable `PUBLIC_ALLOW_REGISTRATION`, Standard false) — Änderung = neues Image.
    image: ghcr.io/hyabusa1990/bsapp-archscore-frontend:${WEB_TAG:-latest}
    restart: unless-stopped
    pull_policy: always
    ports:
      - '${WEB_PORT:-18080}:8080'
